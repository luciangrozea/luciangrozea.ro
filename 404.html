<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Pagina nu există / Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body>
  <main class="hero">
    <div class="hero__grid" aria-hidden="true"></div>
    <div class="container hero__content">
      <p class="eyebrow mono">// eroare · error</p>
      <h1 class="hero__title"><span class="accent">404</span></h1>
      <p class="hero__subtitle">Pagina căutată nu există. Poate a fost mutată sau n-a fost construită încă.</p>
      <p class="hero__subtitle" lang="en">The page you're looking for doesn't exist. It may have moved or hasn't been built yet.</p>
      <div class="hero__cta">
        <a href="/" class="btn">Înapoi acasă</a>
        <a href="/en/" class="btn btn--ghost" lang="en">Back home</a>
      </div>
    </div>
  </main>
</body>
</html>
